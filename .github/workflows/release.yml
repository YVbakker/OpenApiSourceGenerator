name: Publish NuGet package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-pack-push:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore --locked-mode
        working-directory: ./src/OpenApiSourceGenerator

      - name: Build (Release)
        run: dotnet build -c Release --no-restore
        working-directory: ./src/OpenApiSourceGenerator

      - name: Determine version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack -c Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }} -o ../../artifacts
        working-directory: ./src/OpenApiSourceGenerator

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "./artifacts/OpenApiSourceGenerator.${{ steps.version.outputs.version }}.nupkg"

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/OpenApiSourceGenerator.${{ steps.version.outputs.version }}.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source "https://api.nuget.org/v3/index.json" --skip-duplicate
